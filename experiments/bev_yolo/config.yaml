# BEV toy experiment: does rectifying to a bird's-eye view give a better-fitting
# runway target than segmenting the perspective image -- and once rectified, is
# an oriented box enough, with no pixel mask at all?
#
# Four arms, one config. See README.md.

source:
  # Where the collector wrote the episodes. The regenerated dataset lands in
  # ~/Documents/xp12_dataset by default (collector config.yaml, output_dir);
  # point this at datasets/xp12_dataset to run against the old one.
  root: /home/linok/Documents/xp12_dataset
  runways_dat: null            # null -> the collector's own utils/runways.dat

dataset:
  out: datasets/bev_toy
  jpeg_quality: 92

camera:
  # calibrate.py fits these from the logs and writes camera.json; if it is
  # missing, the values below are used as a guess. Fitted on the OLD dataset:
  # fx 1003.4, fy 1014.7, tilt +0.03 deg, 1.4 px median corner residual.
  fit: experiments/bev_yolo/camera.json
  width: 1280
  height: 720
  fov_x_deg: 65.0              # X-Plane view preference
  fov_y_deg: 39.43
  tilt_deg: 0.0                # camera looks straight down the body x axis

select:
  stride: 5                    # every 5th frame; ~90 frames per episode
  max_episodes: null           # set to e.g. 20 for a smoke test
  min_range_m: 150             # capture stops at 150 m, so this keeps everything
  max_range_m: 1500            # capture starts at 3000 m, but the first half of the
                               # episode is LOCALIZER CAPTURE, not approach: measured
                               # over 60 episodes, |yaw| runs to 14 deg and cross-track
                               # to 54 m median beyond 2.2 km, which throws the
                               # threshold hundreds of metres off the heading axis and
                               # out of any high-resolution BEV canvas. Inside 1500 m
                               # the p99 lateral offset is 63 m and a +-96 m canvas
                               # holds it. Raise this only with mode: altitude, and
                               # expect to trade resolution for coverage.
  min_area_px: 200             # drop frames where the warped runway is a smear
  drop_side_clipped: true      # drop frames where the runway runs off the SIDE of the
                               # canvas. Far-end clipping is fine (the estimator only
                               # uses the near edge); side clipping shaves the runway
                               # lengthwise and biases cross-track inboard by metres.

split_fractions:               # grouped by AIRPORT, not by episode
  train: 0.8
  val: 0.1

bev:
  # Matches experiments.bev.grids.GridPolicy field for field.
  mode: threshold              # threshold | altitude | horizon | fixed
  width_px: 320                # ~1:3 canvas -- the runway is long and thin, and the
  height_px: 1024              # visible ground is a wedge, so a wide canvas is mostly
                               # black. Square metric pixels are non-negotiable: an
                               # anisotropic scale turns the rotated runway into a
                               # parallelogram and the oriented box stops fitting.
  x_near_m: 50.0               # mode: fixed
  x_far_m: 1200.0
  x_near_h: 2.0                # mode: altitude, in multiples of height AGL.
  x_far_h: 30.0                # On a 3 deg glideslope the threshold sits at ~19h,
                               # so 2h..30h holds it at roughly constant size.
  horizon_margin_px: 24.0      # mode: horizon
  mpp_m: 0.75                  # mode: threshold. Fixed scale -> a 45 m runway is
                               # 60 px across in EVERY frame, at 3 km and at 200 m.
  back_m: 150.0                # canvas starts this far short of the threshold, so
                               # the threshold sits 150 m / 0.75 = 200 rows up
  min_range_m: 20.0
  max_range_m: 4000.0

train:
  # Shared across arms so a difference in the result is attributable to the arm.
  epochs: 30                   # a toy run: ~20 min/arm on a 3090 Ti at this size
  batch: 16
  imgsz: 640
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  cos_lr: true
  seed: 0
  fliplr: 0.0                  # a mirror flips the runway AND the sign of the
                               # heading error, which is the quantity under test
  mosaic: 0.0                  # composites four viewpoints into one frame
  degrees: 0.0                 # would rotate the BEV target off its true heading
  project: experiments/bev_yolo/runs
  weights:
    segment: checkpoints/yolov8s-seg.pt
    obb: yolov8s-obb.pt        # downloaded on first use; no seg equivalent needed

eval:
  split: test
  conf: 0.25
  range_bins_m: [150, 300, 600, 1000, 1500]
