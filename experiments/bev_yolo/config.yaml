# BEV toy experiment: does rectifying to a bird's-eye view give a better-fitting
# runway target than segmenting the perspective image -- and once rectified, is
# an oriented box enough, with no pixel mask at all?
#
# Four arms, one config. See README.md.

source:
  # Where the collector wrote the episodes. The regenerated dataset lands in
  # ~/Documents/xp12_dataset by default (collector config.yaml, output_dir);
  # point this at datasets/xp12_dataset to run against the old one.
  root: /home/linok/Downloads/valnet/datasets/xp12_dataset
  runways_dat: null            # null -> the collector's own utils/runways.dat

dataset:
  out: datasets/bev_toy
  jpeg_quality: 95

camera:
  # calibrate.py fits these from the logs and writes camera.json; if it is
  # missing, the values below are used as a guess. Fitted on the OLD dataset:
  # fx 1003.4, fy 1014.7, tilt +0.03 deg, 1.4 px median corner residual.
  fit: experiments/bev_yolo/camera.json
  width: 1280
  height: 720
  fov_x_deg: 65.0              # X-Plane view preference
  fov_y_deg: 39.43
  tilt_deg: 0.0                # camera looks straight down the body x axis

select:
  stride: 5                    # every 5th frame; ~90 frames per episode
  max_episodes: null           # set to e.g. 20 for a smoke test
  min_range_m: 150             # capture stops at 150 m, so this keeps everything
  max_range_m: 1500            # capture starts at 3000 m, but the first half of the
                               # episode is LOCALIZER CAPTURE, not approach: measured
                               # over 60 episodes, |yaw| runs to 14 deg and cross-track
                               # to 54 m median beyond 2.2 km, which throws the
                               # threshold hundreds of metres off the heading axis and
                               # out of any high-resolution BEV canvas. Inside 1500 m
                               # the p99 lateral offset is 63 m and a +-96 m canvas
                               # holds it. Raise this only with mode: altitude, and
                               # expect to trade resolution for coverage.
  min_area_px: 200             # drop frames where the warped runway is a smear
  drop_side_clipped: true      # drop frames where the runway runs off the SIDE of the
                               # canvas. Far-end clipping is fine (the estimator only
                               # uses the near edge); side clipping shaves the runway
                               # lengthwise and biases cross-track inboard by metres.

split_fractions:               # grouped by AIRPORT, not by episode
  train: 0.8
  val: 0.1

arms:
  # One cell of the experiment each: a view, a target geometry, and -- for the
  # bev arms -- which ground raster. Adding an arm is an edit here plus a
  # rebuild; the builder, trainer, evaluator and visualiser all read this.
  persp_seg:   {view: perspective, target: segment}
  persp_obb:   {view: perspective, target: obb}
  bev_seg:     {view: bev, target: segment, grid: threshold}
  bev_obb:     {view: bev, target: obb,     grid: threshold}
  bev_seg_alt: {view: bev, target: segment, grid: altitude}
  bev_obb_alt: {view: bev, target: obb,     grid: altitude}

grids:
  # Named ground rasters. Each field maps onto experiments.bev.grids.GridPolicy.
  # A frame is kept only if it is usable under EVERY grid listed here and in the
  # perspective view, so every arm is trained and scored on the same frames.

  threshold:
    # Canvas placed on the KNOWN along-track range at a fixed scale, so the
    # threshold lands on the same canvas row and the runway spans the same
    # number of pixels in every image. Measured cost: the along-range stretch
    # grows from 2.5x at 200 m to 31x at 1.4 km, and only 617 m of runway fits
    # at ANY range.
    mode: threshold
    width_px: 320
    height_px: 1024
    mpp_m: 0.75
    back_m: 150.0
    min_range_m: 20.0
    max_range_m: 4000.0

  altitude:
    # Canvas tied to height instead of to a fixed scale. On these approaches the
    # range/height ratio is 13 median (6.9-21.9 p5-p95), so a 2h..30h window
    # spans a near-constant number of source rows: the stretch stays at 2.1x at
    # every range and the runway inside the canvas grows to 1212 m at 1.4 km.
    # Measured cost: the runway narrows to 20 px at range, and the threshold no
    # longer lands on a fixed row.
    mode: altitude
    width_px: 320
    height_px: 1024
    x_near_h: 2.0
    x_far_h: 30.0
    min_range_m: 20.0
    max_range_m: 4000.0

train:
  # Shared across arms so a difference in the result is attributable to the arm.
  epochs: 30                   # a toy run: ~20 min/arm on a 3090 Ti at this size
  batch: 16                    # at imgsz 1024 this is ~2.6x the activation memory of
                               # the 640 run; drop to 8 if a 24 GB card complains
  imgsz: 1024                  # the BEV canvas is 320x1024, so 640 letterboxed it DOWN
                               # to 200x640 and threw away 37% of the linear resolution
                               # already on disk. At 1024 the canvas maps 1:1. The
                               # perspective arms gain too (1280x720 -> 1024x576 instead
                               # of 640x360), so the comparison stays even.
                               # Cost: the 1:3 canvas is padded to square, so ~69% of
                               # each tile is padding. Set rect=True to cut that, at the
                               # price of Ultralytics disabling shuffle.
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  cos_lr: true
  seed: 0
  fliplr: 0.0                  # a mirror flips the runway AND the sign of the
                               # heading error, which is the quantity under test
  mosaic: 0.0                  # composites four viewpoints into one frame
  degrees: 0.0                 # would rotate the BEV target off its true heading
  project: experiments/bev_yolo/runs
  weights:
    segment: checkpoints/yolov8s-seg.pt
    obb: checkpoints/yolov8s-obb.pt        # downloaded on first use; no seg equivalent needed

eval:
  split: test
  conf: 0.25
  range_bins_m: [150, 300, 600, 1000, 1500]
